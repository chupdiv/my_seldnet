# ==============================================================================
#  config.yaml — Конфигурация генерации синтетического реверберантного набора
#                 данных (gpuRIR, SELD)
# ==============================================================================
#  Все значения здесь — значения по умолчанию.
#  Любой параметр можно переопределить через CLI-аргументы (config.py).
# ==============================================================================

# ── Параметры генерации ────────────────────────────────────────────────────
generation:
  fs:                      44100        # частота дискретизации, Гц
  n_mics:                  5           # количество микрофонов (4 или 5)
  seed:                    20260405    # случайное зерно
  out_prefix:              "20260405"  # префикс выходных файлов
  duration_sec:            5          # длительность аудиофрагмента, с
  files_count:             6000        # целевое количество файлов

# ── Параметры сигнала ──────────────────────────────────────────────────────
signal:
  frame_step:              0.1         # шаг разметки (сетка аннотаций), с
  lowpass_hz:              20000        # Butterworth LPF, Гц; 0 = отключить
  rms_normalize:           true        # нормализация по мощности
  rms_min:                 0.1
  rms_max:                 0.3

# ── Параметры комнаты ──────────────────────────────────────────────────────
room:
  min:                     [4.0, 4.0, 4.0]    # мин. размеры [Lx, Ly, Lz], м
  max:                     [14.0, 10.0, 8.0]   # макс. размеры [Lx, Ly, Lz], м
  delta:                   0.5                  # мин. отстояние от стен, м
  air_temperature_min:     15.0                # мин. температура воздуха, °C
  air_temperature_max:     25.0                # макс. температура воздуха, °C

# ── Реверберация (gpuRIR) ─────────────────────────────────────────────────
reverb:
  rt60:                    0.6         # время реверберации, с
  att_max:                 40.0        # затухание на конце симуляции, дБ
  att_diff:                15.0        # диффузное затухание, дБ
  max_rirs_length:         8196        # макс. длина RIR, сэмплов
  chunk_size:              500         # размер батча gpuRIR

# ── Микширование ───────────────────────────────────────────────────────────
mixing:
  train_fraction:          0.85        # доля файлов для train-сплита
  overlap_touch_counts:    false       # считать смежные интервалы перекрытием

# ── Микрофонные решётки ───────────────────────────────────────────────────
microphones:
  mics_4:
    - [0.0,    0.0,    0.08016]
    - [0.0577, 0.0,    0.0    ]
    - [-0.02885, -0.05,  0.0   ]
    - [-0.02885,  0.05,  0.0   ]
  mics_5:
    - [0.0,    -0.05, -0.05]
    - [0.0,    -0.05,  0.05]
    - [0.0,     0.05,  0.05]
    - [0.0,     0.05, -0.05]
    - [0.0707,  0.0,   0.0  ]

# ── Пути ───────────────────────────────────────────────────────────────────
paths:
  datasets:                "../datasets/seld_data"  # корень датасетов
  drone_wav:               "drone_sounds"
  env_wav:                 "DataSED/SED_wav"
  env_csv:                 "DataSED/SED_ground_truth/Polyphonic_sound_detection.csv"
  voice_wav:               "Hifitts/hifitts_clean"
  voice_json:              "Hifitts/hifitts_clean.json"

  output_dir:              null      # выходная директория; null = автогенерация

  # ── Аугментация ─────────────────────────────────────────────────────────
augmentation:
  enabled:                 true        # включить аугментацию при генерации
  prob:                    0.5         # вероятность применения аугментации
  clip_after:              true        # нормализовать пик до 1.0 после аугментации

  gaussian_noise:
    p:                      0.3         # вероятность применения
    min_amplitude:          0.001
    max_amplitude:          0.01

  time_stretch:
    p:                      0.3
    min_rate:               0.9
    max_rate:               1.1

  pitch_shift:
    p:                      0.3
    min_semitones:          -2
    max_semitones:          2

  shift:
    p:                      0.3
    min_shift:              -0.1        # секунды
    max_shift:              0.1

  gain:
    p:                      0.4
    min_gain_db:            -6.0
    max_gain_db:            6.0

  clipping_distortion:
    p:                      0.3
    min_percentile_threshold: 0
    max_percentile_threshold: 10

  band_pass_filter:
    p:                      0.3
    min_center_freq:        300         # Гц
    max_center_freq:        3000        # Гц

  polarity_inversion:
    p:                      0.2

  background_noise:
    enabled:                false        # включить, если есть папка с шумами
    noise_dir:              null         # путь к папке с файлами шума; null = отключить
    p:                      0.4
    min_snr_db:             10
    max_snr_db:             30


# ── Утилиты ───────────────────────────────────────────────────────────────
utils:
  run_sanity_check:        false       # запуск sanity-check после генерации
